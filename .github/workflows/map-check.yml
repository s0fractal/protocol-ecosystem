name: retirement-invariant
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: retired repository exposes no live map
        run: |
          python3 - <<'PY'
          from pathlib import Path

          readme = Path("README.md").read_text(encoding="utf-8")
          retirement = Path("RETIREMENT.md").read_text(encoding="utf-8")
          campaign = Path("CAMPAIGN.md").read_text(encoding="utf-8")

          required_readme = (
              "# protocol-ecosystem — archived",
              "**Disposition:** `ARCHIVED`",
              "## Successor boundaries",
              "## Reactivation boundary",
          )
          for marker in required_readme:
              if marker not in readme:
                  raise SystemExit(f"retirement envelope missing: {marker}")

          forbidden_live_map = (
              "## Members",
              "## Relations",
              "Map-wide status review:",
          )
          for marker in forbidden_live_map:
              if marker in readme:
                  raise SystemExit(f"live map surface reintroduced: {marker}")

          required_retirement = (
              "status: ARCHIVED",
              "mode: FUNCTION_DECOMPOSED",
              "last_active_snapshot: f819c05bf12a7cdd52176a8bc899351b453154d3",
              "## Known loss",
              "## Reactivation rule",
          )
          for marker in required_retirement:
              if marker not in retirement:
                  raise SystemExit(f"retirement record missing: {marker}")

          if "**FROZEN HISTORICAL RECORD.**" not in campaign:
              raise SystemExit("historical campaign lacks frozen-status banner")

          print("retirement envelope and historical boundary intact")
          PY
